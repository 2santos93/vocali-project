name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Static analysis and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Terraform formats its own files. Prettier has no authority over HCL,
      # so the two gates are separate and this one needs the real binary.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ordered cheapest first, so an obvious failure reports in seconds
      # instead of behind a full test run.
      - name: Check formatting
        run: pnpm format:check

      - name: Check Terraform formatting
        run: pnpm format:check:tf

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Runs coverage rather than plain tests: the thresholds are part of the
      # gate, and `pnpm test` alone does not evaluate them.
      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            apps/api/coverage
            packages/contracts/coverage
          retention-days: 7

  e2e:
    name: End-to-end journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The Cypress binary is fetched by the package's own install script,
      # which `onlyBuiltDependencies` in pnpm-workspace.yaml allows to run.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the application
        run: pnpm --filter @vocali/web build

      - name: Run the journeys
        run: |
          pnpm --filter @vocali/web preview &
          timeout 120 bash -c 'until curl -sf http://localhost:3000/login > /dev/null; do sleep 2; done'
          pnpm e2e

      # Only written when something failed, which is exactly when the run needs
      # explaining and the log alone does not.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: apps/web/cypress/screenshots
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A separate job so that a new advisory published upstream fails on its
      # own line instead of hiding a genuine test failure behind it.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate commit messages
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
