name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Static analysis and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Terraform formats its own files. Prettier has no authority over HCL,
      # so the two gates are separate and this one needs the real binary.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ordered cheapest first, so an obvious failure reports in seconds
      # instead of behind a full test run.
      - name: Check formatting
        run: pnpm format:check

      - name: Check Terraform formatting
        run: pnpm format:check:tf

      # `-backend=false` initialises the providers and the modules without
      # reaching for the state, so this needs no AWS credential and cannot read
      # the Cognito client secret the state file holds. Each root module is
      # validated on its own; the child modules are checked through whichever
      # root calls them.
      - name: Validate Terraform
        run: |
          for root in infra/bootstrap infra/environments/*/; do
            echo "::group::${root}"
            terraform -chdir="${root}" init -backend=false -input=false -no-color
            terraform -chdir="${root}" validate -no-color
            echo "::endgroup::"
          done

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Runs coverage rather than plain tests: the thresholds are part of the
      # gate, and `pnpm test` alone does not evaluate them.
      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            apps/api/coverage
            packages/contracts/coverage
          retention-days: 7

  e2e:
    name: End-to-end journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The binary lives in ~/.cache/Cypress, outside both node_modules and the
      # pnpm store, so neither cache restores it. Its own install script only
      # runs when pnpm actually links the package, which a store cache hit
      # skips: the first run downloaded it and every run after found it gone.
      - name: Cache the Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Downloads the binary when the cache missed, and says so and stops when
      # it is already there.
      - name: Install the Cypress binary
        run: pnpm --filter @vocali/web exec cypress install

      - name: Build the application
        run: pnpm --filter @vocali/web build

      - name: Run the journeys
        run: |
          pnpm --filter @vocali/web preview &
          timeout 120 bash -c 'until curl -sf http://localhost:3000/login > /dev/null; do sleep 2; done'
          pnpm e2e

      # Only written when something failed, which is exactly when the run needs
      # explaining and the log alone does not.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: apps/web/cypress/screenshots
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A separate job so that a new advisory published upstream fails on its
      # own line instead of hiding a genuine test failure behind it.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate commit messages
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
